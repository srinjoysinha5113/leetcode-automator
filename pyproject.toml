[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-automator"
version = "0.1.0"
description = "NeetCode 150 Automated LeetCode Solver with Ollama & Playwright"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "ollama>=0.1.7",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "SQLAlchemy>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning"
]



